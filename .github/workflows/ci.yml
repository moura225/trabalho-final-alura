name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_user -d crm_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_ENGINE: postgresql
      DB_NAME: crm_db
      DB_USER: crm_user
      DB_PASSWORD: crm_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m coverage run --rcfile=.coveragerc manage.py test clientes
      - name: Enforce coverage threshold
        run: python -m coverage report --rcfile=.coveragerc --fail-under=85
      - name: Export coverage report
        run: python -m coverage xml --rcfile=.coveragerc -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Build Docker image
        run: docker build --tag crm-api:${{ github.sha }} .
